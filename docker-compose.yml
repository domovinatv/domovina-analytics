# Coolify: "Docker Compose" resurs nad ovim repoom (main), compose path
# /docker-compose.yml. Javni hostnamei idu kroz Cloudflare Tunnel → Traefik
# (vidi docs/deploy.md); nijedan port nije bindan na host.
#
# Lokalno: `docker compose up` uz docker-compose.override.yml (portovi na
# localhost). Coolify override ignorira jer deploya s eksplicitnim -f.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CH_INGEST_PASSWORD: ${CH_INGEST_PASSWORD:?}
      CH_READER_PASSWORD: ${CH_READER_PASSWORD:?}
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/apply.sh:/docker-entrypoint-initdb.d/apply.sh:ro
      - ./clickhouse/sql:/analytics/sql:ro
      - ./clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    expose:
      - "8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.11
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Zagreb
      CH_READER_PASSWORD: ${CH_READER_PASSWORD:?}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  ch_data:
  grafana_data:
